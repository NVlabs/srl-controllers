[build-system]
requires = ["setuptools>=84,<85", "setuptools-scm>=10.2,<11", "pybind11>=3.1.0,<4.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-srl-controllers"
authors = [
  {name = "NVIDIA Seattle Robotics Lab"},
]
description = "A Python wrapped C++ library for robot controllers."
keywords = ["docker"]
classifiers = [
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Framework :: Robot Framework :: Library",
]
dynamic = ["version", "readme"]
license = "LicenseRef-NVIDIA-2022-03-22 AND Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md", "examples/ur/ur_description_LICENSE"]
requires-python = ">=3.12"

dependencies = [
  "numpy>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
build = [
  "pybind11>=3.1.0,<4.0.0",
]

ci = [
  # Linting
  # -------
  "black==26.5.1",
  "cpplint==2.0.2",
  "flake8==7.3.0",
  "flake8-copyright==0.2.4",
  "flake8-docstrings==1.7.0",
  "flake8-isort==7.0.0",
  "flake8-rst-docstrings==0.4.0",
  "flake8-pyproject==1.2.4",
  "isort==8.0.1",
  "mypy==2.3.1",
  "pep8-naming==0.15.1",

  # Testing
  # -------
  "gcovr==8.6",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",

  # Documentation linting
  # ---------------------
  "docutils==0.22.2",

  # Packaging
  # ---------
  "build==1.5.0",

  # Other
  # -----
  "anybadge==1.16.0",
]

[project.urls]
Homepage = "https://gitlab-master.nvidia.com/srl/cpp/controllers/-/blob/main/README.md"
Documentation = "https://srl.gitlab-master-pages.nvidia.com/cpp/controllers/"
Repository = "https://gitlab-master.nvidia.com/srl/cpp/controllers/"
Issues = "https://gitlab-master.nvidia.com/srl/cpp/controllers/-/issues"
Changelog = "https://gitlab-master.nvidia.com/srl/cpp/controllers/-/blob/main/CHANGELOG.md"

