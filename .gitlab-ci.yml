      def main():
          if os.environ.get("CI_PROJECT_ID") != "160347":
              raise SystemExit("This check is restricted to the Controllers GitLab project.")
          if os.environ.get("CI_COMMIT_REF_PROTECTED") != "true":
              raise SystemExit("Use the canonical protected release branch.")
          if os.environ.get("CI_COMMIT_BRANCH") != "main":
              raise SystemExit("Unexpected preparation branch.")
