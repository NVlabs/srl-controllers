                      shutil.copyfile(sbom, output / "sbom.cdx.json")
                  report = work / report_name
                  if report.is_file():
                      shutil.copyfile(report, output / report_name)
              receipt["status"] = "cli_returned_success"
              receipt["completion"] = "inventory_findings_and_coverage_require_review"
              (output / "execution.json").write_text(json.dumps(receipt, indent=2) + "\n")


      if __name__ == "__main__":
          main()
      PY

controllers_malware_archive:
  stage: prepare
  inherit:
    default: false
    variables: false
  image:
    name: gitlab-master.nvidia.com:5005/srl/cpp/controllers/ci@sha256:d2d9c10fb18b638925a34d42caf9ad47a2c8af7dcbaa7121920b60440e59906e
    pull_policy: always
  tags: [os-linux, arch-amd64]
  needs: []
  dependencies: []
  before_script: []
  after_script: []
  cache: []
  retry: 0
  timeout: 10 minutes
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "3"
    GIT_SUBMODULE_STRATEGY: none
    GIT_LFS_SKIP_SMUDGE: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CONTROLLERS_MALWARE_SCAN == "1"'
      when: manual
      allow_failure: false
    - when: never
  artifacts:
    access: developer
    expire_in: 1 day
    paths:
      - controllers-malware-input/
  script:
    - |
      python3 -I - <<'PY'
      """CI-only data packaging; no project code or build scripts are executed."""
      import gzip
      import hashlib
      import io
      import json
      import os
      from pathlib import Path
      import subprocess
      import tarfile

      BASE = os.environ["CI_COMMIT_SHA"]
      if len(BASE) != 40 or any(c not in "0123456789abcdef" for c in BASE):
          raise SystemExit("A full immutable pipeline commit is required.")
      BRANCH = "main"


      def main():
          required = {"CI_PROJECT_ID": "160347", "CI_COMMIT_BRANCH": BRANCH,
                      "CI_COMMIT_REF_PROTECTED": "true", "CONTROLLERS_MALWARE_SCAN": "1"}
          if any(os.environ.get(k) != v for k, v in required.items()):
              raise SystemExit("Wrong project, protected branch or explicit malware gate.")
          project = Path(os.environ["CI_PROJECT_DIR"])
          clean = {"PATH": "/usr/local/bin:/usr/bin:/bin", "LANG": "C.UTF-8",
                   "GIT_CONFIG_NOSYSTEM": "1", "GIT_CONFIG_GLOBAL": "/dev/null"}

          def git(*args):
              return subprocess.check_output(["git", "-c", "safe.directory=" + str(project), *args],
                                             cwd=project, env=clean, timeout=120)

          if git("rev-parse", "HEAD").decode().strip() != BASE:
              raise SystemExit("Checkout does not match the immutable pipeline candidate.")
          expected = {}
          for row in git("ls-tree", "-rz", "--full-tree", BASE).split(b"\0"):
              if not row:
                  continue
              metadata, name = row.split(b"\t", 1)
              mode, kind, oid = metadata.split()
              if kind != b"blob":
                  raise SystemExit("Submodule or unsupported tree entry requires explicit content resolution.")
              expected[name.decode()] = {"blob": oid.decode(), "mode": mode.decode()}
          if not expected:
              raise SystemExit("The immutable candidate tree is empty.")
          prefix = "controllers-" + BASE + "/"
          raw = git("archive", "--format=tar", "--prefix=" + prefix, BASE)
          seen = {}
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:") as archive:
              for member in archive.getmembers():
                  if member.isdir():
                      continue
                  if not member.name.startswith(prefix):
                      raise SystemExit("Unexpected archive root.")
                  name = member.name[len(prefix):]
                  if member.issym():
                      data = member.linkname.encode()
                  elif member.isfile():
                      data = archive.extractfile(member).read()
                  else:
                      raise SystemExit("Unsupported archive entry.")
                  if data.startswith(b"version https://git-lfs.github.com/spec/v1\n"):
                      raise SystemExit("LFS pointer found; resolve the actual payload before scanning.")
                  seen[name] = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          if set(seen) != set(expected) or any(seen[k] != expected[k]["blob"] for k in seen):
              raise SystemExit("Archive content differs from the selected candidate.")
          output = project / "controllers-malware-input"
          output.mkdir(exist_ok=True)
          name = "controllers-source-" + BASE + ".tar.gz"
          path = output / name
          with path.open("wb") as destination:
              with gzip.GzipFile(fileobj=destination, mode="wb", filename="", mtime=0) as compressed:
                  compressed.write(raw)
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          (output / "SHA256SUMS").write_text(digest + "  " + name + "\n")
          manifest = {"source_commit": BASE, "archive": name, "archive_sha256": digest,
                      "archive_bytes": path.stat().st_size, "tracked_files": len(expected),
                      "archive_files": len(seen), "git_blob_content_match": True,
                      "source_code_executed": False, "build_executed": False,
                      "scanner_started": False, "lfs_pointers": 0,
                      "scope": "all tracked files at the selected commit; no Git history"}
          (output / "input-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest))


      if __name__ == "__main__":
          main()
      PY


controllers_malware_file_scan:
  stage: security
  inherit:
    default: false
    variables: false
  image:
    name: gitlab-master.nvidia.com:5005/pstooling/pulse-group/pulse-malware-scanner-cli@sha256:9d1f9c6868ae5c63322adb345e66f2d7d00f4027d3dbac47ba7861c3332be831
    entrypoint: [""]
    pull_policy: always
  tags: [os-linux, arch-amd64]
  needs:
    - job: controllers_malware_archive
      artifacts: true
  before_script: []
  after_script: []
  cache: []
  retry: 0
  timeout: 20 minutes
  allow_failure: false
  variables:
    GIT_STRATEGY: empty
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CONTROLLERS_MALWARE_SCAN == "1"'
      when: manual
    - when: never
  artifacts:
    when: always
    access: developer
    expire_in: 1 day
    paths:
      - controllers-malware-results/input-manifest.json
      - controllers-malware-results/auth-error.json
      - controllers-malware-results/execution.json
      - controllers-malware-results/malware_report.json
  script:
    - |
      #!/bin/sh
      # Proposed remote job only. No repository code, install hooks or builds run here.
      set +x
      set -eu
      umask 077
      if [ "${CI_PROJECT_ID:-}" != "160347" ] ||
         [ "${CI_COMMIT_BRANCH:-}" != "main" ] ||
         [ "${CI_COMMIT_REF_PROTECTED:-}" != "true" ] ||
         [ "${CONTROLLERS_MALWARE_SCAN:-}" != "1" ]; then
        echo "Wrong project, protected branch or explicit malware gate."
        exit 1
      fi
      case "${CI_PIPELINE_SOURCE:-}" in api|web) ;; *) exit 1 ;; esac
      for executable in curl grep sed sha256sum base64 tr mktemp awk head pulse-malware-scanner-cli; do
        command -v "$executable" >/dev/null || { echo "Required runtime tool missing: $executable"; exit 1; }
      done
      test -n "${SF_CLIENT_ID:-}" && test -n "${SF_CLIENT_SECRET:-}" || {
        echo "Existing protected Controllers SSA variables were not delivered."
        exit 1
      }
      SOURCE_COMMIT=${CI_COMMIT_SHA:?Missing immutable pipeline commit}
      case "$SOURCE_COMMIT" in *[!0-9a-f]*|"") exit 1 ;; esac
      test "${#SOURCE_COMMIT}" -eq 40 || exit 1
      cd "$CI_PROJECT_DIR/controllers-malware-input"
      sha256sum -c SHA256SUMS
      FILE="controllers-source-${SOURCE_COMMIT}.tar.gz"
      test -s "$FILE"
      grep -F "\"source_commit\": \"$SOURCE_COMMIT\"" input-manifest.json >/dev/null
      RESULTS="$CI_PROJECT_DIR/controllers-malware-results"
      mkdir -p "$RESULTS"
      cp input-manifest.json "$RESULTS/input-manifest.json"
      TOKEN_RESPONSE=$(mktemp)
      CLI_LOG=$(mktemp)
      cleanup() {
        rm -f "$TOKEN_RESPONSE" "$CLI_LOG"
        rm -f "$RESULTS/pulse-cli.log"
      }
      trap cleanup EXIT HUP INT TERM
      ISSUER='https://x9thwm-cootr2q1jdv5p7b8iw4fs4ob3x6nqqsoznyk.ssa.nvidia.com/token'
      SCOPES='nspect.verify pms.scan.image pms.read.malware pcsf.verify.skopeo pms.scan.file'
      # Match the official CLI README: form body, not query parameters.
      # Credentials flow through stdin, never curl argv or diagnostic files.
      BASIC_AUTH=$(printf '%s:%s' "$SF_CLIENT_ID" "$SF_CLIENT_SECRET" | base64 | tr -d '\n')
      HTTP_CODE=$(printf 'header = "Authorization: Basic %s"\n' "$BASIC_AUTH" |
        curl --silent --show-error --config - --output "$TOKEN_RESPONSE" --write-out '%{http_code}' \
          --connect-timeout 20 --max-time 60 --request POST \
          --header 'Content-Type: application/x-www-form-urlencoded' \
          --data-urlencode 'grant_type=client_credentials' \
          --data-urlencode "scope=$SCOPES" "$ISSUER")
      unset BASIC_AUTH
      if [ "$HTTP_CODE" != "200" ]; then
        # Persist only a standard OAuth error code. Never save/print the raw
        # response or error_description, which could echo credential material.
        OAUTH_ERROR=$(sed -n 's/.*"error"[[:space:]]*:[[:space:]]*"\([a-z_]*\)".*/\1/p' "$TOKEN_RESPONSE" | head -n 1)
        case "$OAUTH_ERROR" in
          invalid_request|invalid_client|invalid_grant|unauthorized_client|unsupported_grant_type|invalid_scope|access_denied|server_error|temporarily_unavailable) ;;
          *) OAUTH_ERROR=unparsed ;;
        esac
        case "$HTTP_CODE" in [0-9][0-9][0-9]) ;; *) HTTP_CODE=000 ;; esac
        printf '{"http_status":"%s","oauth_error":"%s","scan_submitted":false}\n' \
          "$HTTP_CODE" "$OAUTH_ERROR" >"$RESULTS/auth-error.json"
        printf 'SSA token request rejected (HTTP %s; %s); no malware scan submitted.\n' "$HTTP_CODE" "$OAUTH_ERROR"
        exit 1
      fi
      SSA_TOKEN=$(sed -n 's/.*"access_token" *: *"\([^"]*\)".*/\1/p' "$TOKEN_RESPONSE")
      rm -f "$TOKEN_RESPONSE"
      test -n "$SSA_TOKEN" || { echo "No SSA access token returned; no scan submitted."; exit 1; }
      export SSA_TOKEN
      # Keep originals only for output redaction until the scanner completes.
      # The CLI sees only the minted SSA token, not the long-lived client secret.
      unset REDACT_CLIENT_ID REDACT_CLIENT_SECRET
      REDACT_CLIENT_ID=$SF_CLIENT_ID
      REDACT_CLIENT_SECRET=$SF_CLIENT_SECRET
      unset SF_CLIENT_ID SF_CLIENT_SECRET SSA_CLIENT_ID SSA_CLIENT_SECRET PULSE_BEARER_TOKEN
      printf '{"state":"submission_about_to_start","source_commit":"%s","official_completion":"not_inferred"}\n' "$SOURCE_COMMIT" >"$RESULTS/execution.json"
      cd "$CI_PROJECT_DIR"
      FILE="controllers-malware-input/$FILE"
      set +e
      pulse-malware-scanner-cli -n NSPECT-BE6H-WKN4 --base-url=prp.security.pe.nvidia.com --output-dir=controllers-malware-results \
        --wait=true --output=true file-scan --file "$FILE" --tenant general-access \
        --wait-sec 0 --backoff-sec 2 --wait-retries 20 --max-poll-wait-sec 30 \
        --priority 3 --concurrency 5 >"$CLI_LOG" 2>&1
      CLI_EXIT=$?
      set -e
      # Redact known credentials before showing any diagnostic output. No raw log artifact.
      export REDACT_CLIENT_ID REDACT_CLIENT_SECRET
      awk '
      function remove_literal(s, secret, p) {
        if (secret == "") return s;
        while ((p=index(s,secret))>0) s=substr(s,1,p-1) "[REDACTED]" substr(s,p+length(secret));
        return s;
      }
      {
        s=remove_literal($0,ENVIRON["SSA_TOKEN"]);
        s=remove_literal(s,ENVIRON["REDACT_CLIENT_ID"]);
        s=remove_literal(s,ENVIRON["REDACT_CLIENT_SECRET"]);
        print s;
      }' "$CLI_LOG"
      unset SSA_TOKEN REDACT_CLIENT_ID REDACT_CLIENT_SECRET
      printf '{"cli_exit_code":%s,"source_commit":"%s","operation":"file-scan","nspect_id":"NSPECT-BE6H-WKN4","tenant":"general-access","wait_for_final_result":true,"forced_rescan":false,"nspect_report_override":false,"official_completion":"not_inferred"}\n' "$CLI_EXIT" "$SOURCE_COMMIT" >"$RESULTS/execution.json"
      if [ "$CLI_EXIT" = "0" ] && [ ! -s "$RESULTS/malware_report.json" ]; then
        echo "CLI returned success without the expected final report; result remains unverified."
        exit 1
      fi
      exit "$CLI_EXIT"

controllers_malware_auth_diagnostic:
  stage: diagnostic
  inherit:
    default: false
    variables: false
  image:
    name: gitlab-master.nvidia.com:5005/srl/cpp/controllers/ci@sha256:d2d9c10fb18b638925a34d42caf9ad47a2c8af7dcbaa7121920b60440e59906e
    pull_policy: always
  tags: [os-linux, arch-amd64]
  needs: []
  dependencies: []
  before_script: []
  after_script: []
  cache: []
  timeout: 5 minutes
  retry: 0
  allow_failure: false
  variables:
    GIT_STRATEGY: empty
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CONTROLLERS_MALWARE_AUTH_DIAGNOSTIC == "1"'
      when: manual
    - when: never
  artifacts:
    when: always
    access: developer
    expire_in: 1 week
    paths:
      - controllers-malware-auth-result/diagnostic.json
  script:
    - |
      python3 -I - <<'PY'
      """Proposed one-request remote CI authentication diagnostic; never scans/uploads."""
      import base64
      import json
      import os
      from pathlib import Path
      import re
      import urllib.error
      import urllib.parse
      import urllib.request

      ENDPOINT = 'https://x9thwm-cootr2q1jdv5p7b8iw4fs4ob3x6nqqsoznyk.ssa.nvidia.com/token'
      SCOPES = 'nspect.verify pms.scan.image pms.read.malware pcsf.verify.skopeo pms.scan.file'
      EXPECTED_CLIENT = 'nvssa-prd-1fftnvhw9zCkM8DdKf7iaIMB320W-PPrUn-odTwwjLM'


      def summarize(status, body, headers, forbidden):
          def clean(value):
              text = str(value)
              for secret in forbidden:
                  if secret:
                      for variant in (secret, urllib.parse.quote(secret, safe=''), urllib.parse.quote_plus(secret)):
                          text = text.replace(variant, '[REDACTED]')
              text = re.sub(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+', '[REDACTED_JWT]', text)
              text = re.sub(r'[A-Za-z0-9_=-]{48,}', '[REDACTED_LONG_VALUE]', text)
              return text[:1200]
          result = {'http_status': status, 'request_attempt_count': 1, 'scan_submitted': False,
                    'token_persisted': False, 'raw_response_persisted': False,
                    'response_bytes': len(body), 'official_completion': 'not_inferred'}
          result['safe_headers'] = {k: clean(headers[k]) for k in
                                    ('content-type', 'x-request-id', 'x-correlation-id', 'traceparent') if headers.get(k)}
          try:
              data = json.loads(body)
              if not isinstance(data, dict):
                  raise ValueError('Response is not an object')
          except (ValueError, UnicodeError):
              result['body_format'] = 'non_json_or_non_object'
              return result
          result['body_format'] = 'json_object'
          if status == 200:
              result['token_received'] = bool(isinstance(data.get('access_token'), str) and data['access_token'])
              result['returned_scope'] = clean(data.get('scope', ''))
          else:
              # SSA uses RFC7807 fields; retain OAuth fields too for compatibility.
              result['problem'] = {k: clean(data[k]) for k in
                                   ('type', 'title', 'status', 'detail', 'instance', 'error', 'error_description')
                                   if k in data and isinstance(data[k], (str, int, float, bool))}
          return result


      class NoRedirect(urllib.request.HTTPRedirectHandler):
          def redirect_request(self, req, fp, code, msg, hdrs, newurl):
              return None


      def main():
          required = {'CI_PROJECT_ID': '160347', 'CI_COMMIT_BRANCH': 'main',
                      'CI_COMMIT_REF_PROTECTED': 'true', 'CONTROLLERS_MALWARE_AUTH_DIAGNOSTIC': '1'}
          if any(os.environ.get(k) != v for k, v in required.items()) or os.environ.get('CI_PIPELINE_SOURCE') not in ('api', 'web'):
              raise SystemExit('Diagnostic requires its exact authorized protected CI context.')
          client = os.environ.pop('SF_CLIENT_ID', '')
          secret = os.environ.pop('SF_CLIENT_SECRET', '')
          output = Path(os.environ['CI_PROJECT_DIR']) / 'controllers-malware-auth-result'
          output.mkdir(parents=True, exist_ok=True)
          metadata = {'expected_client_id_matches': client == EXPECTED_CLIENT,
                      'secret_has_outer_whitespace': bool(secret and secret.strip() != secret),
                      'endpoint': ENDPOINT, 'requested_scopes': SCOPES.split(),
                      'scan_submitted': False, 'library_source_executed': False}
          if client != EXPECTED_CLIENT or not secret:
              metadata['state'] = 'client_binding_or_secret_missing_no_request_sent'
              (output / 'diagnostic.json').write_text(json.dumps(metadata, indent=2) + '\n')
              return 1
          basic = base64.b64encode((client + ':' + secret).encode()).decode()
          request = urllib.request.Request(ENDPOINT, data=urllib.parse.urlencode(
              {'grant_type': 'client_credentials', 'scope': SCOPES}).encode(),
              headers={'Authorization': 'Basic ' + basic, 'Content-Type': 'application/x-www-form-urlencoded'})
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
                  status, body = response.status, response.read(16384)
                  headers = {k.lower(): v for k, v in response.headers.items()}
          except urllib.error.HTTPError as error:
              status, body = error.code, error.read(16384)
              headers = {k.lower(): v for k, v in error.headers.items()}
          except Exception as error:
              metadata.update(state='transport_failure', exception_type=type(error).__name__, request_attempt_count=1)
              (output / 'diagnostic.json').write_text(json.dumps(metadata, indent=2) + '\n')
              print('Authentication diagnostic encountered a transport error; no retry or scan.')
              return 1
          metadata.update(summarize(status, body, headers, (client, secret, basic)))
          metadata['state'] = 'authentication_response_received'
          (output / 'diagnostic.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print(json.dumps({'state': metadata['state'], 'http_status': status, 'scan_submitted': False}))
          return 0 if status == 200 and metadata.get('token_received') else 1


      if __name__ == '__main__':
          raise SystemExit(main())
      PY

controllers_oss_runtime_check:
  stage: verify
  inherit:
    default: false
    variables: false
  image:
    name: gitlab-master.nvidia.com:5005/srl/cpp/controllers/ci@sha256:d2d9c10fb18b638925a34d42caf9ad47a2c8af7dcbaa7121920b60440e59906e
