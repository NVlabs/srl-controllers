              source.mkdir()
              git_basic = base64.b64encode(("gitlab-ci-token:" + job_token).encode()).decode()
              secrets.append(git_basic)
              run(["git", "init", str(source)])
              fetch_env = {**clean, "GIT_TERMINAL_PROMPT": "0", "GIT_CONFIG_COUNT": "1",
                           "GIT_CONFIG_KEY_0": "http.https://gitlab-master.nvidia.com/.extraHeader",
                           "GIT_CONFIG_VALUE_0": "Authorization: Basic " + git_basic}
              run(["git", "-C", str(source), "fetch", "--tags", "--no-recurse-submodules",
                   "https://gitlab-master.nvidia.com/srl/cpp/controllers.git", BASE], env=fetch_env)
              run(["git", "-C", str(source), "checkout", "--force", "--detach", BASE])
              actual_commit = run(["git", "-C", str(source), "rev-parse", "HEAD"], capture=True).strip()
              if actual_commit != BASE:
                  raise SystemExit("Candidate Git checkout mismatch.")
              run(["git", "-C", str(source), "describe", "--tags", "--match", "v*"], capture=True)
