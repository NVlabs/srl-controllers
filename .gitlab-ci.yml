              probe.write_text(
                  "#include <Eigen/Core>\n#include <boost/filesystem.hpp>\n"
                  "#include <urdf_model/model.h>\nint main() { return 0; }\n"
              )
              include_flags = shlex.split(run(["pkg-config", "--cflags", "eigen3", "urdfdom"], capture=True))
              run(["c++", "-std=c++17", "-fsyntax-only", *include_flags, str(probe)])

