      COLLECTOR_SOURCE = '"""Proposed remote post-scan collector using pinned official Pulse SDK APIs.\n\nThis module imports no scanner or authentication library until its remote entry\npoint is called. Local validation uses injected fake callbacks only.\n"""\nimport contextlib\nimport hashlib\nimport io\nimport json\nimport logging\nimport os\nfrom pathlib import Path\nimport re\nimport sys\nimport time\nimport uuid\n\nSCOPE_POLICY_SOURCE = \'# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.\\n# SPDX-License-Identifier: LicenseRef-NVIDIA-2022-03-22\\n"""Validate non-shipped location configuration before the existing native import."""\\n\\nimport hashlib\\nimport io\\nfrom pathlib import Path\\nimport re\\n\\n\\ndef load_exclusions(source_root, parse_allowlist, nspect_id="NSPECT-BE6H-WKN4"):\\n    """Keep the official Pulse parser and exclude-directory payload unchanged.\\n\\n    No policy is active until the repository contains a reviewed allowlist file.\\n    This hook supports location scope only, never vulnerability dispositions.\\n    """\\n    path = Path(source_root) / ".nspect-allowlist.toml"\\n    if path.is_symlink():\\n        raise ValueError("The release scope policy must be a regular repository file")\\n    if not path.exists():\\n        return [], None\\n    if not path.is_file() or path.stat().st_size > 128 * 1024:\\n        raise ValueError("Invalid or oversized release scope policy")\\n    content = path.read_bytes()\\n    config = parse_allowlist(io.StringIO(content.decode("utf-8"))).get_allow_config()\\n    if config.get("allow_vulns") or config.get("nvidia_dependencies"):\\n        raise ValueError("This scope correction does not authorize vulnerability or ownership overrides")\\n    selected = []\\n    for entry in config.get("excluded_directories", []):\\n        if entry.get("nspect_ids") and nspect_id not in entry["nspect_ids"]:\\n            continue\\n        if not entry.get("paths") or not entry.get("comment", "").strip():\\n            raise ValueError("Excluded directories need explicit paths and rationale")\\n        for path in entry["paths"]:\\n            if len(path) > 2000 or any(char in path for char in "\\\\r\\\\n\\\\0"):\\n                raise ValueError("Invalid package-location pattern")\\n            literal = path\\n            if path.endswith(r"$(?!\\\\n)"):\\n                encoded = path[:-len(r"$(?!\\\\n)")]\\n                literal = re.sub(r"\\\\\\\\(.)", r"\\\\1", encoded)\\n                if not literal or re.escape(literal) != encoded:\\n                    raise ValueError("File patterns must match one escaped literal location exactly")\\n            elif not path.endswith("/"):\\n                raise ValueError("Use a directory path or an exact anchored file-location pattern")\\n            if literal.lower() in {"/", "//", "./", ".*/", "/usr/", "/usr/include/", "/usr/lib/", "/lib/"}:\\n                raise ValueError("A broad system/source root is not a validated package scope")\\n            # Pulse lowercases patterns before matching. Do not use \\\\\\\\Z: it becomes\\n            # \\\\\\\\z on the pinned Python runtime. The end/newline guard stays exact\\n            # under Pulse\\\'s re.MULTILINE flag and case normalization.\\n            re.compile(path.lower(), re.M | re.I)\\n        selected.append(entry)\\n    return selected, hashlib.sha256(content).hexdigest()\\n\\n\\ndef preview_locations(exclusions, package_locations, matches):\\n    """Show all retained locations; missing/blank locations cannot establish exclusion."""\\n    paths = [path for entry in exclusions for path in entry["paths"]]\\n    result = []\\n    for package in package_locations:\\n        locations = package.get("locations", [])\\n        excluded = [location for location in locations if matches(location, paths)]\\n        complete = package.get("complete") is True and bool(locations) and all(locations)\\n        result.append({"name": package["name"], "version": package["version"],\\n                       "origin": package.get("origin"), "complete": bool(complete),\\n                       "locations": locations, "matched": excluded,\\n                       "fully_excluded": bool(complete and len(excluded) == len(locations))})\\n    return result\\n\'\nimport types as _scope_types\n_scope_policy = _scope_types.ModuleType("controllers_scope_policy")\nexec(SCOPE_POLICY_SOURCE, _scope_policy.__dict__)\n\nBASE = os.environ["CI_COMMIT_SHA"]\nif len(BASE) != 40 or any(c not in "0123456789abcdef" for c in BASE):\n    raise SystemExit("A full immutable pipeline commit is required.")\n\n\ndef atomic_json(path, value, forbidden=()):\n    text = json.dumps(value, indent=2) + "\\n"\n    if any(secret and secret in text for secret in forbidden):\n        raise ValueError("Credential detected in proposed output; output refused")\n    temporary = path.with_suffix(path.suffix + ".tmp")\n    temporary.write_text(text)\n    temporary.replace(path)\n\n\ndef save_component_match_evidence(output, data, backend, forbidden=()):\n    """Retain the normal BOM and both review views through GET-only SDK calls.\n\n    get_items owns pagination. Materialize every collection before labelling\n    the snapshots complete; iterator errors must not create partial snapshots.\n    The unfiltered review view retains low-score and future review categories.\n    It does not confirm matches or change the server\'s visibility defaults.\n    """\n    component_rows = list(data.get_project_components(\n        backend.project, backend.version, confirm_unknown_versions=False))\n    project_row = data.get_project_by_name(backend.project)\n    version_row = data.get_project_version_by_name(project_row, backend.version)\n    version_href = version_row.get("_meta", {}).get("href", "")\n    if not version_href.startswith(backend.url.rstrip("/") + "/api/projects/"):\n        raise ValueError("Unexpected existing backend version URL")\n    review_url = version_href.rstrip("/") + "/review-components"\n    headers = {"Accept": "application/vnd.blackducksoftware.bill-of-materials-5+json"}\n    review_rows = list(data.hub.get_items(\n        review_url, params={"filter": "bomMatchReviewType:UNKNOWN_VERSION"},\n        headers=headers))\n    all_review_rows = list(data.hub.get_items(review_url, headers=headers))\n    output = Path(output)\n    output.mkdir(parents=True, exist_ok=True)\n    atomic_json(output / "backend-components.json", {\n        "source": "official Black Duck normal components GET",\n        "items": component_rows, "complete": True,\n        "unknown_versions_confirmed": False}, forbidden)\n    atomic_json(output / "backend-review-components.json", {\n        "source": "official Black Duck review-components GET",\n        "filter": "bomMatchReviewType:UNKNOWN_VERSION",\n        "items": review_rows, "complete": True,\n        "unknown_versions_confirmed": False}, forbidden)\n    atomic_json(output / "backend-match-review-components.json", {\n        "source": "official Black Duck review-components GET",\n        "filter": None, "items": all_review_rows, "complete": True,\n        "components_confirmed": False}, forbidden)\n\n\ndef collect(output, identity, *, status, export_sbom, export_findings, import_inventory,\n            forbidden=(), sleep=time.sleep, attempts=20):\n    """Persist raw exports, retain the backend, then submit one native inventory import.\n\n    Callbacks must address exactly identity\'s unique job-scoped backend project.\n    The import callback queues native inventory processing; it never changes dispositions.\n    """\n    output = Path(output)\n    output.mkdir(parents=True, exist_ok=True)\n    receipt = {**identity, "state": "waiting_for_existing_inventory",\n               "scan_submission": False, "cleanup_attempted": False,\n               "official_completion": "not_inferred"}\n    receipt_path = output / "inventory-export.json"\n    if receipt_path.exists(