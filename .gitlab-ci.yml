      COLLECTOR_SOURCE = '"""Proposed remote post-scan collector using pinned official Pulse SDK APIs.\n\nThis module imports no scanner or authentication library until its remote entry\npoint is called. Local validation uses injected fake callbacks only.\n"""\nimport contextlib\nimport hashlib\nimport io\nimport json\nimport logging\nimport os\nfrom pathlib import Path\nimport re\nimport sys\nimport time\nimport uuid\n\nBASE = os.environ["CI_COMMIT_SHA"]\nif len(BASE) != 40 or any(c not in "0123456789abcdef" for c in BASE):\n    raise SystemExit("A full immutable pipeline commit is required.")\n\n\ndef atomic_json(path, value, forbidden=()):\n    text = json.dumps(value, indent=2) + "\\n"\n    if any(secret and secret in text for secret in forbidden):\n        raise ValueError("Credential detected in proposed output; output refused")\n    temporary = path.with_suffix(path.suffix + ".tmp")\n    temporary.write_text(text)\n    temporary.replace(path)\n\n\ndef save_component_match_evidence(output, data, backend, forbidden=()):\n    """Retain the normal BOM and both review views through GET-only SDK calls.\n\n    get_items owns pagination. Materialize every collection before labelling\n    the snapshots complete; iterator errors must not create partial snapshots.\n    The unfiltered review view retains low-score and future review categories.\n    It does not confirm matches or change the server\'s visibility defaults.\n    """\n    component_rows = list(data.get_project_components(\n        backend.project, backend.version, confirm_unknown_versions=False))\n    project_row = data.get_project_by_name(backend.project)\n    version_row = data.get_project_version_by_name(project_row, backend.version)\n    version_href = version_row.get("_meta", {}).get("href", "")\n    if not version_href.startswith(backend.url.rstrip("/") + "/api/projects/"):\n        raise ValueError("Unexpected existing backend version URL")\n    review_url = version_href.rstrip("/") + "/review-components"\n    headers = {"Accept": "application/vnd.blackducksoftware.bill-of-materials-5+json"}\n    review_rows = list(data.hub.get_items(\n        review_url, params={"filter": "bomMatchReviewType:UNKNOWN_VERSION"},\n        headers=headers))\n    all_review_rows = list(data.hub.get_items(review_url, headers=headers))\n    output = Path(output)\n    output.mkdir(parents=True, exist_ok=True)\n    atomic_json(output / "backend-components.json", {\n        "source": "official Black Duck normal components GET",\n        "items": component_rows, "complete": True,\n        "unknown_versions_confirmed": False}, forbidden)\n    atomic_json(output / "backend-review-components.json", {\n        "source": "official Black Duck review-components GET",\n        "filter": "bomMatchReviewType:UNKNOWN_VERSION",\n        "items": review_rows, "complete": True,\n        "unknown_versions_confirmed": False}, forbidden)\n    atomic_json(output / "backend-match-review-components.json", {\n        "source": "official Black Duck review-components GET",\n        "filter": None, "items": all_review_rows, "complete": True,\n        "components_confirmed": False}, forbidden)\n\n\ndef collect(output, identity, *, status, export_sbom, export_findings, cleanup,\n            forbidden=(), sleep=time.sleep, attempts=20):\n    """Persist both inventories before cleanup; retries only existing reads.\n\n    Callbacks must address exactly identity\'s unique job-scoped backend project.\n    No callback submits a scan or changes component/finding dispositions.\n    """\n    output = Path(output)\n    output.mkdir(parents=True, exist_ok=True)\n    receipt = {**identity, "state": "waiting_for_existing_inventory",\n               "scan_submission": False, "cleanup_attempted": False,\n               "official_completion": "not_inferred"}\n    receipt_path = output / "inventory-export.json"\n    atomic_json(receipt_path, receipt, forbidden)\n    for attempt in range(attempts):\n        current = status()\n        receipt["processing_status"] = current\n        atomic_json(receipt_path, receipt, forbidden)\n        if current == {"scan": "SCAN_COMPLETE", "bom": "UP_TO_DATE"}:\n            break\n        if current.get("bom") == "UP_TO_DATE_WITH_ERRORS":\n            raise ValueError("BOM completed with errors; coverage remains unresolved")\n        if attempt + 1 == attempts:\n            raise TimeoutError("Existing scan/BOM still processing; no scan resubmitted")\n        sleep(15)\n\n    sbom = export_sbom()\n    if not isinstance(sbom, dict) or sbom.get("bomFormat") != "CycloneDX":\n        raise ValueError("Expected official CycloneDX export")\n    components = sbom.get("components")\n    if not isinstance(components, list) or not components:\n        raise ValueError("Empty or missing component inventory; coverage unresolved")\n    if any(not isinstance(c, dict) or not c.get("name") for c in components):\n        raise ValueError("Malformed component inventory")\n    atomic_json(output / "sbom.cdx.json", sbom, forbidden)\n    receipt.update(state="sbom_saved", component_count=len(components))\n    atomic_json(receipt_path, receipt, forbidden)\n\n    findings = export_findings()\n    if not isinstance(findings, dict) or findings.get("status") != "COMPLETE":\n        raise ValueError("Vulnerability report incomplete; keep backend evidence")\n    if not isinstance(findings.get("data"), list):\n        raise ValueError("Vulnerability report missing findings array")\n    atomic_json(output / "cpp-vulnerabilities.json", findings, forbidden)\n    receipt.update(state="both_exports_saved", finding_count=len(findings["data"]),\n                   files={name: hashlib.sha256((output / name).read_bytes()).hexdigest()\n                          for name in ["sbom.cdx.json", "cpp-vulnerabilities.json"]})\n    atomic_json(receipt_path, receipt, forbidden)\n    # Cleanup is the official temporary-project lifecycle, limited to a unique\n    # per-job project. It occurs only after both complete files are on disk.\n    receipt["cleanup_attempted"] = True\n    atomic_json(receipt_path, receipt, forbidden)\n    cleanup()\n    receipt.update(state="exports_saved_temporary_backend_cleaned",\n                   cleanup_completed=True,\n                   coverage="component_matching_and_release_reconciliation_required",\n                   findings="review_required" if findings["data"] else "none_in_export")\n    atomic_json(receipt_path, receipt, forbidden)\n    return receipt\n\n\ndef main():\n    import os\n    request = json.loads(Path(sys.argv[1]).read_text())\n    pipeline_id = os.environ.get("CI_PIPELINE_ID", "")\n    job_id = os.environ.get("CI_JOB_ID", "")\n    profile = request["profile"]\n    expected = "srl-controllers-NSPECT-BE6H-WKN4-" + profile + "-" + pipeline_id + "-" + job_id\n    if (not pipeline_id.isdigit() or not job_id.isdigit()\n            or not re.fullmatch(r"[a-z0-9_]+", profile)\n            or request["source_commit"] != BASE\n            or request["project"] != expected\n            or request["version"] != "0.12.0-" + BASE):\n        raise SystemExit("Unexpected collector scope; no backend cleanup allowed")\n    token = os.environ.get("PULSE_BEARER_TOKEN", "")\n    if (os.environ.get("CI_PROJECT_ID") != "160347"\n            or os.environ.get("CI_COMMIT_BRANCH") != "main"\n            or os.environ.get("CI_COMMIT_REF_PROTECTED") != "true"\n            or os.environ.get("CI_PIPELINE_SOURCE") not in {"api", "web"}\n            or os.environ.get("CONTROLLERS_OSS_SCAN") != "1"):\n        raise SystemExit("Collector requires the explicitly gated protected job")\n    if not token:\n        raise SystemExit("Existing short-lived Pulse token required")\n    output = Path(request["output"])\n    identity = {k: request[k] for k in ["source_commit", "profile", "project", "version"]}\n    identity.update(nspect_id="NSPECT-BE6H-WKN4", pipeline_id=pipeline_id,\n                    job_id=job_id, scanner_sdk="nv-pulse==0.8.6")\n    # SDK diagnostic logs/exceptions must never reveal its API key, which is\n    # obtained in this subprocess and never passed via argv or written to disk.\n    logging.disable(logging.CRITICAL)\n    stage = "initialize_official_sdk"\n    try:\n        with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):\n            from pulse.utilities.api_requests import verify_nspect_id_and_retrive_info\n            from pulse.oss.blackduck import Project\n            from pulse.oss.blackduck.project import BomScanStrategy\n            from pulse.oss.blackduck.api.api import BlackDuckDataHandler\n            from pulse.sbom import ReportProvider, Director\n            from pulse.sbom.models import Configure\n            from pulse.errors import InventoryNotUpdatedException, PulseScanStatusFailure\n\n            stage = "verify_existing_nspect_registration"\n            verified = verify_nspect_id_and_retrive_info(\n                "NSPECT-BE6H-WKN4", token,\n                "ssh://git@gitlab-master.nvidia.com:12051/srl/cpp/controllers.git",\n                BASE, str(uuid.uuid4()))\n            api_key = verified.get("api-token", "")\n            if not api_key:\n                raise ValueError("No delegated Black Duck credential returned")\n            backend = Project(url=Project.URL_DEFAULT, api_key=api_key,\n                              project=expected, project_version=request["version"],\n                              SOURCE="c-cpp-scan", bom_scan_strategy=BomScanStrategy.NOOP,\n                              path="")\n            data = BlackDuckDataHandler(bd_api_key=api_key, hub_url=backend.url)\n            identity.update(backend_project=backend.project, backend_version=backend.version)\n\n            def status():\n                try:\n                    scan = backend.check_project_scan_status(backend.scan_name, 1)\n                except PulseScanStatusFailure:\n                    # Processing/failed status is recorded as unresolved; this\n                    # callback never resubmits or retries the scanner.\n                    scan = "NOT_COMPLETE"\n                try:\n                    bom = data.check_bom_status(backend.project, backend.version)\n                except InventoryNotUpdatedException:\n                    bom = "PROCESSING"\n                return {"scan": scan, "bom": bom}\n\n            def sbom():\n                nonlocal stage\n                stage = "read_existing_component_match_evidence"\n                save_component_match_evidence(output, data, backend, (token, api_key))\n                stage = "export_existing_cpp_inventory"\n                config = Configure.default()\n                if verified.get("disclaimers-property-name") and verified.get("disclaimers-text"):\n                    config = Configure(term_of_agreement_name=verified["disclaimers-property-name"],\n                                       term_of_agreement_text=verified["disclaimers-text"])\n                return json.loads(Director(ReportProvider(token=api_key, base_url=backend.url)).create_report_from_bd(\n                    "NSPECT-BE6H-WKN4", expected, request["version"],\n                    backend.project, backend.version, config=config))\n\n            stage = "export_existing_cpp_inventory"\n            result = collect(output, identity, status=status, export_sbom=sbom,\n                             export_findings=lambda: data.create_vulnerability_report(\n                                 backend.project, backend.version, 3),\n                             cleanup=lambda: data.delete_version_and_project(\n                                 project_name=backend.project, version_name=backend.version),\n                             forbidden=(token, api_key))\n        print(json.dumps({"state": result["state"], "component_count": result["component_count"],\n                          "finding_count": result["finding_count"], "official_completion": "not_inferred"}))\n        # No exceptions, allowlists or risk decisions are manufactured. Any\n        # exported findings remain for review rather than auto-clearing the job.\n        return 2 if result["finding_count"] else 0\n    except Exception as error:\n        output.mkdir(parents=True, exist_ok=True)\n        atomic_json(output / "inventory-export-error.json",\n                    {"stage": stage, "exception_type": type(error).__name__,\n                     "scan_resubmitted": False, "retry_requires_reconciliation": True,\n                     "official_completion": "not_inferred"})\n        print("C++ inventory export did not complete; inspect the saved scoped receipt. No scan resubmitted.")\n        return 1\n\n\nif __name__ == "__main__":\n    raise SystemExit(main())\n'
