                  collector = work / "collect_cpp_inventory.py"
                  collector.write_text(COLLECTOR_SOURCE)
                  request_path = work / "inventory-request.json"
                  request_path.write_text(json.dumps({"source_commit": BASE, "profile": PROFILE_ID,
                      "project": project_name, "version": project_version, "output": str(output)}))
                  # The collector receives only the short-lived Pulse bearer token.
                  # It verifies scope again before using the official SDK read/export
                  # APIs and only then cleans its unique job-scoped temporary project.
                  collector_env = {**pulse_env, **{k: os.environ[k] for k in
                      ("CI_PROJECT_ID", "CI_COMMIT_SHA", "CI_COMMIT_BRANCH", "CI_COMMIT_REF_PROTECTED", "CI_PIPELINE_SOURCE",
                       "CI_PIPELINE_ID", "CI_JOB_ID", "CONTROLLERS_OSS_SCAN")}}
              receipt = {"status": "about_to_start", "source_commit": BASE, "source_retrieval": "authenticated_git", "source_git_tree": run(["git", "-C", str(source), "rev-parse", "HEAD^{tree}"], capture=True).strip(), "mode": MODE, "scope": PROFILE_ID, "profile": PROFILE, "expected_components": PROFILE["expected_components"], "full_release_coverage": False, "nspect_report_override": False, "unknown_version_auto_confirmation": False, "command": command, "completion": "not_established"}
              (output / "execution.json").write_text(json.dumps(receipt, indent=2) + "\n")
              (output / "expected-components.json").write_text(json.dumps(PROFILE, indent=2) + "\n")
