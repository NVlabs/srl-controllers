      """CI-only Ubuntu package preflight. Never run this helper on the operator's Mac."""
      import datetime
      import json
      import os
      import pathlib
      import re
      import subprocess

      MINIMUM = {"glibc": "2.39-0ubuntu8.9", "expat": "2.6.1-2ubuntu0.6", "python3.12": "3.12.3-1ubuntu0.15"}
      ENV = {"PATH": "/usr/sbin:/usr/bin:/sbin:/bin", "LC_ALL": "C", "DEBIAN_FRONTEND": "noninteractive", "NEEDRESTART_MODE": "l"}
      FORMAT = "${binary:Package}\t${source:Package}\t${Version}\t${db:Status-Status}\t${db:Status-Eflag}\n"
      NAME = re.compile(r"[a-z0-9][a-z0-9+.-]*(?::[a-z0-9]+)?\Z")
      VERSION = re.compile(r"[0-9][A-Za-z0-9.+:~\-]*\Z")


      def command(argv, root=False):
          if root:
              argv = ["/usr/bin/sudo", "-n", "/usr/bin/env", "-i", *[k + "=" + v for k, v in ENV.items()], *argv]
          result = subprocess.run(argv, env=ENV, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, timeout=1200)
          if result.returncode:
              # Do not persist arbitrary APT/repository output (it may contain credential-bearing URLs).
              raise RuntimeError("Package command failed with exit " + str(result.returncode))
          return result.stdout


      def at_least(value, minimum):
          if not VERSION.fullmatch(value) or not VERSION.fullmatch(minimum):
              raise RuntimeError("Invalid package version")
          result = subprocess.run(["/usr/bin/dpkg", "--compare-versions", value, "ge", minimum], env=ENV, capture_output=True)
          if result.returncode not in (0, 1):
              raise RuntimeError("Package version comparison failed")
          return result.returncode == 0


      def inventory():
          rows = {}
          for line in command(["/usr/bin/dpkg-query", "-W", "-f=" + FORMAT]).splitlines():
              name, source, version, status, error = line.split("\t")
              if status != "installed":
                  continue
              if not NAME.fullmatch(name) or not VERSION.fullmatch(version) or error != "ok":
                  raise RuntimeError("Invalid or unhealthy installed package metadata")
              rows[name] = {"source": source, "version": version}
          return rows


      def resolve(name, rows):
          matches = [p for p in rows if p == name or (":" not in name and p.split(":")[0] == name)]
          if len(matches) != 1:
              raise RuntimeError("Ambiguous or new package in APT plan")
          return matches[0]


      def run_preflight(output):
          evidence = {"state": "started", "minimum_versions": MINIMUM, "scope": "ephemeral tests_tools CI container only"}
          output.parent.mkdir(parents=True, exist_ok=True)
          try:
              release = dict(line.split("=", 1) for line in pathlib.Path("/etc/os-release").read_text().splitlines() if "=" in line)
              if release.get("ID", "").strip('"') != "ubuntu" or release.get("VERSION_ID", "").strip('"') != "24.04":
                  raise RuntimeError("Expected Ubuntu 24.04")
              if command(["/usr/bin/dpkg", "--print-architecture"]).strip() != "amd64":
                  raise RuntimeError("Expected amd64")
              before = inventory()
              selected = {p: row for p, row in before.items() if row["source"] in MINIMUM}
              if {row["source"] for row in selected.values()} != set(MINIMUM):
                  raise RuntimeError("Required package source family missing")
              evidence["before"] = selected
              command(["/usr/bin/apt-get", "-o", "APT::Update::Error-Mode=any", "update"], root=True)
              candidates = {}
              for package, row in sorted(selected.items()):
                  policy = command(["/usr/bin/apt-cache", "policy", package])
                  match = re.search(r"^\s*Candidate:\s*(\S+)\s*$", policy, re.M)
                  candidate = match.group(1) if match else ""
                  if not at_least(candidate, MINIMUM[row["source"]]) or not at_least(candidate, row["version"]):
                      raise RuntimeError("Fixed non-downgrade candidate unavailable for " + package)
                  candidates[package] = candidate
              evidence["candidate_versions"] = candidates
              for family in MINIMUM:
                  if len({candidates[p] for p, row in selected.items() if row["source"] == family}) != 1:
                      raise RuntimeError("Inconsistent candidate versions within " + family)
              specs = [p + "=" + v for p, v in sorted(candidates.items())]
              options = ["--yes", "--no-install-recommends", "--only-upgrade", "--no-remove", "-o", "Dpkg::Options::=--force-confdef", "-o", "Dpkg::Options::=--force-confold"]
              simulation = command(["/usr/bin/apt-get", "--simulate", *options, "install", *specs], root=True)
              planned = {}
              for line in simulation.splitlines():
                  if line.startswith("Remv "):
                      raise RuntimeError("APT proposed removing a package")
                  if line.startswith("Inst "):
                      match = re.match(r"Inst (\S+) (?:\[[^\]]+\] )?\((\S+)", line)
                      if not match:
                          raise RuntimeError("Unrecognized APT plan")
                      package = resolve(match.group(1), before)
                      if package not in selected or match.group(2) != candidates[package]:
                          raise RuntimeError("APT proposed an unapproved package/version")
                      planned[package] = match.group(2)
              required = {p: v for p, v in candidates.items() if v != before[p]["version"]}
              if planned != required:
                  raise RuntimeError("APT plan does not match exact selected upgrades")
              evidence["planned_upgrades"] = planned
              command(["/usr/bin/apt-get", *options, "install", *specs], root=True)
              after = inventory()
              if set(after) != set(before):
                  raise RuntimeError("Installed package set unexpectedly changed")
              changes = {p: {"before": row["version"], "after": after[p]["version"]} for p, row in before.items() if row != after[p]}
              if set(changes) != set(required):
                  raise RuntimeError("Actual package changes differ from approved plan")
              for package, row in selected.items():
                  if after[package]["source"] != row["source"] or after[package]["version"] != candidates[package] or not at_least(after[package]["version"], MINIMUM[row["source"]]):
                      raise RuntimeError("Installed fixed-version verification failed")
              evidence.update(state="fixed_versions_verified", after={p: after[p] for p in selected}, changes=changes)
              print("CI package preflight: fixed versions verified; starting scanner in a fresh process.")
          except Exception as exc:
              # Our errors contain only package names/versions; discard arbitrary external exception text.
              evidence.update(state="failed_before_scan", error=str(exc) if isinstance(exc, RuntimeError) else type(exc).__name__)
              print("CI package preflight failed; inspect package-update.json. Scanner must not run.")
              raise SystemExit(1)
          finally:
              evidence["recorded_at"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              output.write_text(json.dumps(evidence, indent=2) + "\n")
              output.chmod(0o600)


      if __name__ == "__main__":
          run_preflight(pathlib.Path("controllers-scan-results/tests_tools/package-update.json"))
      PACKAGE_PREFLIGHT_PY
