                  "runtime_check": "passed", "platform": "linux_x86_64",
                  "python": platform.python_version(), "tools": versions,
                  **packages, "detect_version": "11.5.0", "detect_sha256": digest,
                  "source_checkout": False, "controllers_build": False,
                  "coverity_download_or_execution": False, "effective_scanner_access": "not_checked",
                  "scan_started": False, "report_override": False,
              }, sort_keys=True))


      if __name__ == "__main__":
          main()
      PY

controllers_scan_image_refresh:
  stage: prepare
  inherit:
    default: false
    variables: false
  image:
    name: gitlab-master.nvidia.com:5005/srl/cpp/controllers/ci@sha256:d2d9c10fb18b638925a34d42caf9ad47a2c8af7dcbaa7121920b60440e59906e
    pull_policy: always
  tags: [os-linux, arch-amd64]
  needs: []
  dependencies: []
  before_script: []
  after_script: []
  cache: []
  timeout: 1 hour
  retry: 0
  allow_failure: false
  variables:
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: none
    CI_DISPOSABLE_ENVIRONMENT: "true"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CONTROLLERS_SCAN_IMAGE_REFRESH == "1" && $CONTROLLERS_OSS_SCAN != "1" && $CONTROLLERS_MALWARE_SCAN != "1" && $CONTROLLERS_MALWARE_AUTH_DIAGNOSTIC != "1" && $CONTROLLERS_OSS_RUNTIME_CHECK != "1"'
      when: manual
    - when: never
  artifacts:
    when: always
    access: developer
    expire_in: 30 days
    paths: [controllers-scan-image/]
  script:
    - |
      python3 -I - <<'PYBUILD'
      import os
      from pathlib import Path
      import subprocess
      keys = (
          "HOME", "CI_PROJECT_DIR", "CI_COMMIT_SHA", "CI_PIPELINE_ID", "CI_JOB_ID",
          "CI_REGISTRY", "CI_REGISTRY_IMAGE", "CI_JOB_TOKEN",
      )
      clean = {key: os.environ[key] for key in keys}
      clean["PATH"] = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      clean["LANG"] = "C.UTF-8"
      # Scanner service credentials are never passed to the builder or Docker.
      subprocess.run(
          ["/bin/sh", str(Path(clean["CI_PROJECT_DIR"]) / "ci/build_scan_security_image.sh")],
          env=clean, check=True,
      )
      PYBUILD

