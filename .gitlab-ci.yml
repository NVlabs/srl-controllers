                  "PULSE_NSPECT_ID": "NSPECT-BE6H-WKN4",
                  "PULSE_REPO_URL": "ssh://git@gitlab-master.nvidia.com:12051/srl/cpp/controllers.git",
                  "PULSE_REPO_BRANCH": BASE,
              }
              pipeline_id = os.environ.get("CI_PIPELINE_ID", "")
              job_id = os.environ.get("CI_JOB_ID", "")
              if not pipeline_id.isdigit() or not job_id.isdigit():
